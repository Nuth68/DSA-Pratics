<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="610" viewBox="0 0 1000 610" role="img" aria-labelledby="title description">
  <title id="title">Swapping two variables with XOR</title>
  <desc id="description">The values a equals 5 and b equals 3 pass through three XOR operations and become a equals 3 and b equals 5.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eff6ff"/>
      <stop offset="1" stop-color="#f5f3ff"/>
    </linearGradient>
    <linearGradient id="result" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16a34a"/>
      <stop offset="1" stop-color="#15803d"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="1000" height="610" rx="24" fill="url(#background)"/>

  <text x="500" y="48" text-anchor="middle" fill="#0f172a" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="700">XOR Swap — No Temporary Variable</text>
  <text x="500" y="78" text-anchor="middle" fill="#475569" font-family="Inter, Arial, sans-serif" font-size="15">Each XOR operation reversibly encodes or recovers one of the original values.</text>

  <g filter="url(#shadow)">
    <rect x="55" y="112" width="190" height="170" rx="18" fill="#ffffff"/>
    <rect x="285" y="112" width="430" height="92" rx="18" fill="#ffffff"/>
    <rect x="285" y="222" width="430" height="92" rx="18" fill="#ffffff"/>
    <rect x="285" y="332" width="430" height="92" rx="18" fill="#ffffff"/>
    <rect x="755" y="254" width="190" height="170" rx="18" fill="url(#result)"/>
  </g>

  <text x="150" y="145" text-anchor="middle" fill="#2563eb" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="1.5">INPUT</text>
  <text x="95" y="195" fill="#0f172a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="28" font-weight="700">a = 5</text>
  <text x="95" y="242" fill="#0f172a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="28" font-weight="700">b = 3</text>

  <text x="315" y="143" fill="#7c3aed" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700">STEP 1</text>
  <text x="315" y="176" fill="#0f172a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="21" font-weight="700">a = a XOR b = 6</text>
  <text x="560" y="176" fill="#64748b" font-family="Inter, Arial, sans-serif" font-size="15">Store both values</text>

  <text x="315" y="253" fill="#7c3aed" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700">STEP 2</text>
  <text x="315" y="286" fill="#0f172a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="21" font-weight="700">b = a XOR b = 5</text>
  <text x="560" y="286" fill="#64748b" font-family="Inter, Arial, sans-serif" font-size="15">Recover original a</text>

  <text x="315" y="363" fill="#7c3aed" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700">STEP 3</text>
  <text x="315" y="396" fill="#0f172a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="21" font-weight="700">a = a XOR b = 3</text>
  <text x="560" y="396" fill="#64748b" font-family="Inter, Arial, sans-serif" font-size="15">Recover original b</text>

  <line x1="245" y1="197" x2="275" y2="197" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="715" y1="378" x2="745" y2="378" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>

  <text x="850" y="286" text-anchor="middle" fill="#dcfce7" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="1.5">RESULT</text>
  <text x="850" y="342" text-anchor="middle" fill="#ffffff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="34" font-weight="700">[3, 5]</text>
  <text x="850" y="382" text-anchor="middle" fill="#dcfce7" font-family="Inter, Arial, sans-serif" font-size="15">Values swapped!</text>

  <rect x="150" y="474" width="700" height="88" rx="16" fill="#0f172a"/>
  <text x="500" y="508" text-anchor="middle" fill="#a5b4fc" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="1">KEY INSIGHT</text>
  <text x="500" y="540" text-anchor="middle" fill="#ffffff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="19">x XOR x = 0     •     x XOR 0 = x</text>

  <text x="500" y="592" text-anchor="middle" fill="#64748b" font-family="Inter, Arial, sans-serif" font-size="13">Original a becomes the second value; original b becomes the first.</text>
</svg>
